services:
  db:
    image: postgis/postgis:16-3.4
    container_name: kaamsetu_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaamsetu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaamsetu_secure_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kaamsetu_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaamsetu_user} -d ${POSTGRES_DB:-kaamsetu_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaamsetu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaamsetu_user}:${POSTGRES_PASSWORD:-kaamsetu_secure_dev_password}@db:5432/${POSTGRES_DB:-kaamsetu_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-kaamsetu_user}:${POSTGRES_PASSWORD:-kaamsetu_secure_dev_password}@db:5432/${POSTGRES_DB:-kaamsetu_db}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: kaamsetu_postgres_data
