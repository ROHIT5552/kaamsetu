<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14232b" />
      <stop offset="100%" stop-color="#0a1216" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdc40" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ffc21a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#293d49" stroke-width="4" />
  
  <!-- Lightning Bolt Symbol (Fast On-Demand) -->
  <path d="M 280 64 L 144 288 L 264 288 L 232 448 L 368 224 L 248 224 Z" 
        fill="url(#amberGrad)" 
        filter="url(#glow)" />
        
  <!-- Worker Tool Accent (Wrench Outline) -->
  <circle cx="370" cy="370" r="48" fill="#ffc21a" opacity="0.9" />
  <text x="370" y="386" font-size="44" text-anchor="middle" font-family="system-ui, sans-serif">🛠️</text>
  
  <!-- Brand Text at Bottom -->
  <text x="256" y="475" text-anchor="middle" font-size="34" font-weight="800" font-family="'Baloo 2', system-ui, sans-serif" fill="#ffffff">
    Kaam<tspan fill="#ffc21a">Setu</tspan>
  </text>
</svg>
