databases:
  - name: kaamsetu-postgres
    databaseName: kaamsetu
    user: kaamsetu_user
    plan: free
    region: oregon

services:
  - type: web
    name: kaamsetu-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-postgres
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_DOMAIN
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: KaamSetu <noreply@kaamsetu.in>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
